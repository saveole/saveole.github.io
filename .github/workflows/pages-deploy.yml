name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 20 * * *'  # UTC 20:00 = 北京时间凌晨 4:00
  workflow_dispatch:
  repository_dispatch:
    types: [running_data_updated, token_usage_updated]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checkout token-usage data
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: saveole/token-usage
          path: token-usage
          token: ${{ secrets.TOKEN_USAGE_READ_TOKEN }}

      - name: Checkout running data
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: saveole/running
          path: running-data
          token: ${{ secrets.RUNNING_DATA_READ_TOKEN || secrets.TOKEN_USAGE_READ_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: node build.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: deploy-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
